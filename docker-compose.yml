services:
  test:
    build: .
    tty: true
    volumes:
      - .:/app
      - /app/vendor
    environment:
      DB_MYSQL_HOST: mysql
      DB_MYSQL_USER: admin
      DB_MYSQL_PASS: pass
      DB_PGSQL_HOST: postgres
      DB_PGSQL_USER: admin
      DB_PGSQL_PASS: pass
    command: ["vendor/bin/phpunit", "--colors=always"]
    depends_on:
      mysql:
        condition: service_healthy
      postgres:
        condition: service_healthy

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: pdo4you
      MYSQL_USER: admin
      MYSQL_PASSWORD: pass
    command: ["mysqld", "--log-error-verbosity=1"]
    tmpfs:
      - /var/lib/mysql
    logging:
      driver: "none"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "admin", "-ppass"]
      interval: 3s
      timeout: 3s
      retries: 15
      start_period: 5s

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: pdo4you
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: pass
    tmpfs:
      - /var/lib/postgresql/data
    logging:
      driver: "none"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d pdo4you"]
      interval: 3s
      timeout: 3s
      retries: 10
